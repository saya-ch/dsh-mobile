name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache-dependency-path: native/funnel-host/go.sum
      - run: npm ci
      - name: Test Funnel host
        run: |
          go test ./...
          go vet ./...
        working-directory: native/funnel-host
      - run: npm run build:funnel-host
      - run: npm run check:funnel-licenses:full
      - run: npm run verify
      - name: Pack the per-platform Funnel packages
        run: |
          mkdir -p platform-packages
          for target in win32-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            (cd "packages/funnel-$target" && npm pack --pack-destination "$GITHUB_WORKSPACE/platform-packages")
          done
          ls -l platform-packages
      - name: Pack plugin and release metadata
        run: |
          npm pack
          sha256sum dsh-mobile-*.tgz > dsh-mobile-plugin.sha256
          npm sbom --sbom-format cyclonedx > dsh-mobile-npm-sbom.cdx.json
          go version -m packages/funnel-win32-x64/dsh-mobile-funnel-win32-x64.exe > dsh-mobile-funnel-go-modules.txt
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            go version -m "packages/funnel-$target/dsh-mobile-funnel-$target" >> dsh-mobile-funnel-go-modules.txt
          done
          cp apps/mobile/release.json dsh-mobile-android-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-package
          path: |
            dsh-mobile-*.tgz
            dsh-mobile-plugin.sha256
            dsh-mobile-npm-sbom.cdx.json
            dsh-mobile-funnel-go-modules.txt
            platform-packages/*.tgz
            dsh-mobile-android-release.json
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: package
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-package
          path: release-assets
      - name: Publish Funnel platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The main package lists these as optional dependencies, so a dsh-mobile
          # version must never reach the registry before the packages it names: the
          # install would ask for a version that does not exist.
          version="$(node -p "require('./package.json').version")"
          # Explicit files, not a glob: an unmatched pattern stays literal in bash and
          # used to turn this loop into a hard failure, while an empty match would have
          # published the plugin without any platform package.
          mapfile -t tarballs < <(find release-assets/platform-packages -maxdepth 1 -type f -name '*.tgz' | sort)
          test "${#tarballs[@]}" -eq 5 || { echo "expected 5 platform tarballs, found ${#tarballs[@]}" >&2; exit 1; }
          published=0
          for tarball in "${tarballs[@]}"; do
            base="$(basename "$tarball" .tgz)"
            name="${base%-$version}"
            case "$name" in
              dsh-mobile-funnel-*) ;;
              *) echo "unexpected platform package name: $name" >&2; exit 1 ;;
            esac
            # Reconcile through the same helper the plugin uses: only a genuine 404
            # permits publication, and an occupied version must hold these exact bytes.
            # Asking the registry for a version separately would treat a network error
            # as absence and publish over an occupied version.
            publication="$(node scripts/check-npm-release-integrity.mjs "$tarball" "$version" "$name")"
            if [ "$publication" = "published" ]; then
              echo "$name@$version is already published with matching tarball integrity."
              continue
            fi
            test "$publication" = "unpublished"
            npm publish "$tarball" --provenance --access public
            echo "published $name@$version"
            published=$((published + 1))
          done
          echo "platform packages handled: ${#tarballs[@]} tarballs" 
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f -name 'dsh-mobile-*.tgz' -print -quit)"
          test -n "$package"
          version="${GITHUB_REF_NAME#v}"
          publication="$(node scripts/check-npm-release-integrity.mjs "$package" "$version")"
          if [ "$publication" = "published" ]; then
            echo "dsh-mobile@$version is already published with matching tarball integrity."
            exit 0
          fi
          test "$publication" = "unpublished"
          npm publish "$package" --provenance --access public

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contributor_note=""
          if [ "$GITHUB_REF_NAME" = "v0.3.2" ]; then
            contributor_note="Special thanks to @JackRushante for PR #16: the secure Android media bridge, image attachments, localization foundation, bounded extension requests, and Funnel lifecycle hardening. The contributor's four original commits are retained in the release history."
          fi
          app_note="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const app=JSON.parse(readFileSync("release-assets/dsh-mobile-android-release.json","utf8")); const tag=encodeURIComponent(app.releaseTag); const version=encodeURIComponent(app.version); process.stdout.write(`Android App: **${app.version}** — [Download APK](https://github.com/saya-ch/dsh-mobile/releases/download/${tag}/dsh-mobile-android-v${version}.apk). Plugin and App versions are independent.`);')"
          release_note="$app_note"
          if [ -n "$contributor_note" ]; then
            release_note="$release_note"$'\n\n'"$contributor_note"
          fi
          # The generated "What's Changed" list includes every commit title on this
          # range, and the Windows client work landed on main under a title that says
          # "publish". Nothing on that track is downloadable, so say so here rather
          # than leaving the list to imply it.
          windows_note="The Windows client under \`apps/windows/\` is an independent prerelease on its own \`windows-v*\` track. It is still an alpha preview and has not been accepted on real Windows hardware; download it from the Windows client releases, not from this one."
          release_note="$release_note"$'\n\n'"$windows_note"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace published assets." >&2
            exit 1
          else
            previous_plugin_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // empty')"
            test -n "$previous_plugin_tag"
            # Only files: the download directory also holds a platform-packages
          # subdirectory, and gh refuses to upload a directory as a release asset.
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes-start-tag "$previous_plugin_tag" \
              --notes "$release_note" \
              --title "$GITHUB_REF_NAME"
          fi
