name: Android Release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  android:
    name: Signed Android package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run check:android-release-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 36 and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 DSH_ANDROID_KEYSTORE_PASSWORD DSH_ANDROID_KEY_ALIAS DSH_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Test and build signed Android package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -PirohNative=true -PirohNdk="$ANDROID_HOME/ndk/25.2.9519653" -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Preserve and verify the full APK before rebuilding compatibility
        run: |
          node scripts/check-iroh-notices.mjs
          version="${GITHUB_REF_NAME#android-v}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-v${version}-iroh.apk"
          node scripts/build-android-transport.mjs --verify-apk "dsh-mobile-android-v${version}-iroh.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Build signed compatibility package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease -PirohNative=false
        working-directory: apps/mobile/android
      - name: Preserve and verify the compatibility APK
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-v${version}.apk"
          node scripts/build-android-transport.mjs --verify-apk "dsh-mobile-android-v${version}.apk" --variant compatibility --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Record Android runtime dependencies
        run: |
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath -PirohNative=true > "$GITHUB_WORKSPACE/dsh-mobile-android-v${GITHUB_REF_NAME#android-v}-iroh-dependencies.txt"
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath -PirohNative=false > "$GITHUB_WORKSPACE/dsh-mobile-android-v${GITHUB_REF_NAME#android-v}-dependencies.txt"
        working-directory: apps/mobile/android
      - name: Verify Android signature
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          report="$RUNNER_TEMP/dsh-mobile-apksigner.txt"
          for apk in dsh-mobile-android-v*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
            node scripts/verify-android-signature.mjs < "$report"
          done
      - name: Enforce Android package size
        run: |
          maximum=$((40 * 1024 * 1024))
          for apk in dsh-mobile-android-v*.apk; do
            actual="$(stat -c %s "$apk")"
            if [ "$actual" -gt "$maximum" ]; then
              echo "$apk is $actual bytes; release limit is $maximum bytes." >&2
              exit 1
            fi
          done
      - name: Name Android package and prepare release descriptor
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          for apk in dsh-mobile-android-v*.apk; do sha256sum "$apk" > "$apk.sha256"; done
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const gradle=readFileSync("apps/mobile/android/app/build.gradle.kts","utf8"); const version=gradle.match(/^\s*versionName\s*=\s*"([^"]+)"\s*$/m)[1]; const versionCode=Number(gradle.match(/^\s*versionCode\s*=\s*(\d+)\s*$/m)[1]); writeFileSync("dsh-mobile-android-release.json", JSON.stringify({version, versionCode, releaseTag:process.env.GITHUB_REF_NAME}, null, 2)+"\n");'
      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: |
            dsh-mobile-android-v*.apk
            dsh-mobile-android-v*.apk.sha256
            dsh-mobile-android-v*-dependencies.txt
            dsh-mobile-android-release.json
          if-no-files-found: error

  github-release:
    name: Publish Android release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-package
          path: release-assets
      - name: Create Android GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Android ${GITHUB_REF_NAME#android-v}. Choose the full -iroh.apk for experimental iroh transport on arm64-v8a / x86_64, or the compatibility .apk for existing HTTPS channels (including 32-bit devices). The legacy update link serves the compatibility APK. Both use the same package and established signer; existing pairing data is retained. Install only one variant. Plugin and App versions are independent."
      - name: Record descriptor promotion step
        run: |
          echo 'After downloading and verifying the published APK, copy dsh-mobile-android-release.json to apps/mobile/release.json in a separate reviewed commit. This workflow does not change the public App pointer.' >> "$GITHUB_STEP_SUMMARY"
