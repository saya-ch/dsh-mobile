name: Android Release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  android:
    name: Signed Android package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - run: npm run check:android-release-tag
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android API 36 and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 DSH_ANDROID_KEYSTORE_PASSWORD DSH_ANDROID_KEY_ALIAS DSH_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Test and build signed Android package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -PirohNative=true -PirohNdk="$ANDROID_HOME/ndk/25.2.9519653" -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Preserve and verify the full APK before rebuilding compatibility
        run: |
          node scripts/check-iroh-notices.mjs
          version="${GITHUB_REF_NAME#android-v}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-v${version}-iroh.apk"
          node scripts/build-android-transport.mjs --verify-apk "dsh-mobile-android-v${version}-iroh.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Build signed compatibility package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease -PirohNative=false
        working-directory: apps/mobile/android
      - name: Preserve and verify the compatibility APK
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-v${version}.apk"
          node scripts/build-android-transport.mjs --verify-apk "dsh-mobile-android-v${version}.apk" --variant compatibility --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Record Android runtime dependencies
        run: |
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath -PirohNative=true > "$GITHUB_WORKSPACE/dsh-mobile-android-v${GITHUB_REF_NAME#android-v}-iroh-dependencies.txt"
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath -PirohNative=false > "$GITHUB_WORKSPACE/dsh-mobile-android-v${GITHUB_REF_NAME#android-v}-dependencies.txt"
        working-directory: apps/mobile/android
      - name: Verify Android signature
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          report="$RUNNER_TEMP/dsh-mobile-apksigner.txt"
          for apk in dsh-mobile-android-v*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
            node scripts/verify-android-signature.mjs < "$report"
          done
      - name: Enforce Android package size
        run: |
          maximum=$((40 * 1024 * 1024))
          for apk in dsh-mobile-android-v*.apk; do
            actual="$(stat -c %s "$apk")"
            if [ "$actual" -gt "$maximum" ]; then
              echo "$apk is $actual bytes; release limit is $maximum bytes." >&2
              exit 1
            fi
          done
      - name: Name Android package and prepare release descriptor
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          for apk in dsh-mobile-android-v*.apk; do sha256sum "$apk" > "$apk.sha256"; done
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const gradle=readFileSync("apps/mobile/android/app/build.gradle.kts","utf8"); const version=gradle.match(/^\s*versionName\s*=\s*"([^"]+)"\s*$/m)[1]; const versionCode=Number(gradle.match(/^\s*versionCode\s*=\s*(\d+)\s*$/m)[1]); writeFileSync("dsh-mobile-android-release.json", JSON.stringify({version, versionCode, releaseTag:process.env.GITHUB_REF_NAME}, null, 2)+"\n");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-package
          path: |
            dsh-mobile-android-v*.apk
            dsh-mobile-android-v*.apk.sha256
            dsh-mobile-android-v*-dependencies.txt
            dsh-mobile-android-release.json
          if-no-files-found: error

  github-release:
    name: Publish Android release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-package
          path: release-assets
      - name: Create Android GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Android ${GITHUB_REF_NAME#android-v}. Choose the full -iroh.apk for experimental iroh transport on arm64-v8a / x86_64, or the compatibility .apk for existing HTTPS channels (including 32-bit devices). The legacy update link serves the compatibility APK. Both use the same package and established signer; existing pairing data is retained. Install only one variant. Plugin and App versions are independent."
      - name: Record descriptor promotion step
        run: |
          echo 'After downloading and verifying the published APK, copy dsh-mobile-android-release.json to apps/mobile/release.json in a separate reviewed commit. This workflow does not change the public App pointer.' >> "$GITHUB_STEP_SUMMARY"

  atomgit-release:
    name: Publish to AtomGit
    needs: github-release
    runs-on: ubuntu-latest
    # The GitHub release stays authoritative; a broken mirror must not hide it.
    continue-on-error: true
    steps:
      - name: Check the mirror token
        id: gate
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "ATOMGIT_TOKEN is not configured; skipping the AtomGit release." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          name: android-package
          path: release-assets
      - name: Create the AtomGit release and attach the packages
        if: steps.gate.outputs.run == 'true'
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="https://api.atomgit.com/api/v5/repos/saya-ch/dsh-mobile"
          notes="Android ${TAG#android-v}. Choose the full -iroh.apk for experimental iroh transport on arm64-v8a / x86_64, or the compatibility .apk for existing HTTPS channels (including 32-bit devices). Both use the same package and established signer; existing pairing data is retained. Install only one variant. Plugin and App versions are independent."

          exists=$(curl -sS -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" "${api}/releases/${TAG}")
          if [ "${exists}" = "200" ]; then
            echo "AtomGit already has a release for ${TAG}; refusing to replace published assets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The tag arrives through the mirror workflow, which runs on the same
          # tag push and may still be cloning, so wait for it before publishing.
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" "${api}/tags/${TAG}")
            [ "${code}" = "200" ] && break
            echo "tag ${TAG} not on AtomGit yet (HTTP ${code}); waiting (${attempt}/30)"
            sleep 20
          done
          if [ "${code}" != "200" ]; then
            echo "::error::tag ${TAG} never appeared on AtomGit; skipping the mirror release."
            exit 1
          fi

          payload=$(jq -n --arg tag "${TAG}" --arg name "Android ${TAG#android-v}" --arg body "${notes}" \
            '{tag_name:$tag, name:$name, body:$body, prerelease:false}')
          status=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            "${api}/releases?access_token=${ATOMGIT_TOKEN}" \
            -H 'Content-Type: application/json' -d "${payload}")
          if [ "${status}" != "200" ]; then
            cat /tmp/create.json >&2
            echo "::error::AtomGit release creation failed (HTTP ${status})."
            exit 1
          fi

          for file in release-assets/*; do
            name=$(basename "${file}")
            upload=$(curl -sS -G -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
              --data-urlencode "file_name=${name}" \
              "${api}/releases/${TAG}/upload_url")
            url=$(printf '%s' "${upload}" | jq -r '.url // empty')
            if [ -z "${url}" ]; then
              printf '%s\n' "${upload}" >&2
              echo "::error::no upload URL for ${name}"
              exit 1
            fi
            headers=()
            while IFS=$'\t' read -r key value; do
              headers+=(-H "${key}: ${value}")
            done < <(printf '%s' "${upload}" | jq -r '.headers | to_entries[] | "\(.key)\t\(.value)"')
            code=$(curl -sS -o /tmp/put.txt -w '%{http_code}' -X PUT "${headers[@]}" --upload-file "${file}" "${url}")
            echo "${name}: HTTP ${code}"
            case "${code}" in
              200|201|204) ;;
              *) cat /tmp/put.txt >&2; echo "::error::upload of ${name} failed (HTTP ${code})."; exit 1 ;;
            esac
          done
          echo "Published ${TAG} to AtomGit with $(ls -1 release-assets | wc -l) assets." >> "$GITHUB_STEP_SUMMARY"
