name: AtomGit mirror

on:
  push:
    branches: [main]
    tags: ['v*', 'android-v*', 'windows-v*']
  # A release is mirrored after it is published, not when its tag is pushed: the assets
  # only exist once the release workflow has finished building them.
  #
  # `release: published` cannot be that trigger here. This repository creates its releases
  # with `github.token`, and GitHub does not start a workflow from an event its own
  # GITHUB_TOKEN produced, so that event never fires for the project's own releases. The
  # v0.9.2 tag run showed both halves: the tag push started this workflow before the
  # release existed, and the event that would have mirrored it afterwards never arrived.
  # Chaining on the workflows that create the release is what actually runs.
  workflow_run:
    # The Android Release workflow mirrors to AtomGit itself (its atomgit-release job), so
    # chaining the mirror onto it would publish the same tag twice.
    workflows: [Release, Windows client release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (for example android-v0.8.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atomgit-mirror
  cancel-in-progress: false

jobs:
  push:
    name: Push ref to AtomGit
    runs-on: ubuntu-latest
    # Only a real push should mirror a ref. Under workflow_run, GITHUB_REF is the default
    # branch, so every completed release workflow re-pushed main to AtomGit.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check the mirror token
        id: gate
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "ATOMGIT_TOKEN is not configured; skipping the AtomGit mirror." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
        with:
          # A shallow clone cannot be pushed to a non-shallow remote.
          fetch-depth: 0
          persist-credentials: false
      - name: Push the ref
        if: steps.gate.outputs.run == 'true'
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://oauth2:${ATOMGIT_TOKEN}@atomgit.com/saya-ch/dsh-mobile.git"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push "${remote}" "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            git push "${remote}" "${GITHUB_SHA}:refs/heads/${GITHUB_REF_NAME}"
          fi
          echo "Pushed ${GITHUB_REF_NAME} (${GITHUB_SHA:0:8}) to AtomGit." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Mirror release assets to AtomGit
    # A tag push cannot mirror a release that does not exist yet, so this job runs after a
    # release workflow finishes, or on demand for a tag that predates the mirror.
    if: >-
      github.event_name == 'workflow_run'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve the tag to mirror
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = 'workflow_dispatch' ]; then
            tag="${DISPATCH_TAG}"
          else
            # A failed build published nothing, so there is nothing to mirror.
            if [ "${RUN_CONCLUSION}" != 'success' ]; then
              echo "The triggering release workflow concluded ${RUN_CONCLUSION}; nothing to mirror." >> "$GITHUB_STEP_SUMMARY"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="${RUN_BRANCH}"
          fi
          case "${tag}" in
            v*|android-v*|windows-v*) ;;
            *) echo "Not a release tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Check the mirror token
        id: gate
        if: steps.tag.outputs.tag != ''
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "ATOMGIT_TOKEN is not configured; skipping the release mirror." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Mirror the release and its assets
        if: steps.gate.outputs.run == 'true'
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/sync-atomgit-release.mjs "${TAG}"
