name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dsh-compatibility:
    name: Current DSH frontend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: mobile
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          # Track the newest released DSH source, not the upstream default branch:
          # unreleased work there would fail this contract for changes no user runs yet.
          ref: dsh-v0.2.2-rc.3
          path: dsh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - run: node mobile/scripts/check-dsh-compatibility.mjs dsh

  mobile-client-boot:
    name: DSH Mobile browser boot (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.1.7-alpha.2, 0.1.7-rc.1, 0.1.7-rc.2, 0.2.0-rc.1, 0.2.0-rc.2, 0.2.1-alpha.2, 0.2.1-alpha.3, 0.2.1-rc.2, 0.2.1-rc.3, 0.2.1-rc.5, 0.2.2-rc.1, 0.2.2-rc.2, 0.2.2-rc.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install pnpm for the live DSH plugin manager
        run: npm install --global pnpm@10.10.0
      - run: npm ci
      - run: npm run build
      - name: Install DSH and pack the Mobile bundle
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/plugin-package"
          mobile_version=$(node -p "require('./package.json').version")
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --no-save --package-lock=false "@deepseek-ai/dsh@${{ matrix.dsh }}"
          echo "DSH_BOOT_SMOKE_BIN=$RUNNER_TEMP/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "DSH_BOOT_SMOKE_MOBILE_TARBALL=$RUNNER_TEMP/plugin-package/dsh-mobile-$mobile_version.tgz" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify passive public Web Push lifecycle contracts
        if: matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.5' || matrix.dsh == '0.2.2-rc.1' || matrix.dsh == '0.2.2-rc.2'
        run: npm run smoke:push-contract
      - name: Verify compressed mux and attachments on the current rc
        if: matrix.dsh == '0.2.2-rc.2' || matrix.dsh == '0.2.2-rc.3'
        run: |
          npm run smoke:attachments
          npm run smoke:dsh-boot -- --compressed-websocket --diagnostics
      - name: Verify current upstream settings, module recovery, picker, attachments and compressed mux
        if: matrix.dsh == '0.2.1-rc.5' || matrix.dsh == '0.2.2-rc.1'
        run: |
          npm run smoke:mobile-settings
          npm run smoke:module-settings
          npm run smoke:directory-picker
          npm run smoke:attachments
          npm run smoke:mobile-sidebar
          npm run smoke:dsh-boot -- --compressed-websocket --diagnostics
      - name: Verify packed Declarative Web Push UI and authenticated navigation
        if: matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.2-rc.2'
        run: npm run smoke:web-push
      - name: Reject a tap reference owned by another paired device
        if: matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.2-rc.2'
        shell: bash
        run: |
          if npm run smoke:web-push -- --negative-control-owner > "$RUNNER_TEMP/web-push-ownership-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/web-push-ownership-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/web-push-ownership-negative.log" "Push ownership negative control detected"
      - name: Verify same-origin Blob media without widening external CSP sources
        if: matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:blob-media
      - name: Verify live installation through the DSH plugin manager
        run: npm run smoke:plugin-installation
      - name: Verify registry installation with isolated pnpm
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        env:
          DSH_BOOT_SMOKE_INSTALL_SOURCE: registry
          DSH_BOOT_SMOKE_NODE_LINKER: isolated
        run: npm run smoke:plugin-installation
      - name: Verify complete cpolar guide config and reject partial replacement
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:cpolar-config
      - name: Verify upgrading the published 0.6.2 bundle
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        shell: bash
        run: |
          previous_dir="$(mktemp -d "$RUNNER_TEMP/mobile-previous.XXXXXX")"
          npm pack dsh-mobile@0.6.2 --ignore-scripts --pack-destination "$previous_dir"
          DSH_BOOT_SMOKE_PREVIOUS_MOBILE_TARBALL="$previous_dir/dsh-mobile-0.6.2.tgz" npm run smoke:plugin-installation
      - run: npm run smoke:native-layout
      - name: Verify tapping a preview path copies it on touch
        run: npm run smoke:path-copy
      - name: Verify mobile root geometry against broad skin overrides
        run: npm run smoke:layout-ownership
      - name: Verify a body-portal plugin menu stays clickable under the drawer
        run: npm run smoke:plugin-portal-layers
      - name: Verify the drawer, details panel and return bar stay opaque under skin tokens
        run: npm run smoke:opaque-chrome
      - name: Verify a fullscreen right panel owns the viewport
        run: npm run smoke:rightbar-fullscreen
      - name: Detect a populated trace collapsed by a foreign root-layout rule
        if: matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        shell: bash
        run: |
          if npm run smoke:layout-ownership -- --negative-control-ownership > "$RUNNER_TEMP/layout-ownership-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/layout-ownership-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/layout-ownership-negative.log" "Mobile layout ownership negative control detected"
      - run: npm run smoke:voice-session
      - run: npm run smoke:composer-keyboard
      - name: Verify reading-mode composer collapse across both built bundles
        run: npm run smoke:composer-reading-mode
      - name: Verify Gallery selection, menu order and stale-result cleanup
        if: matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:gallery
      - name: Verify limited plain-text draft transfer through public DSH input APIs
        if: matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:draft-transfer
      - run: npm run smoke:composer-overflow
      - name: Verify the real stock composer with optional plugin controls
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:composer-toolbar
      - name: Verify sidebar rows and short drawers with additive slots
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:mobile-sidebar
      - name: Verify paired customization ownership and retained-page recovery
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:custom-assets
      - name: Verify authentication and customization across a real Host restart
        if: matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:session-restart
      - name: Verify packed Worker execution and explicit recovery
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:extension-workers
      - name: Verify real mux recovery and cross-client pending questions
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:transport-recovery -- --interactions
      - name: Verify rejected prompts restore text and images without forwarding a model request
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:prompt-failure
      - name: Reject recovery while the real mux remains unavailable
        if: matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        shell: bash
        run: |
          if npm run smoke:transport-recovery -- --negative-control-mux > "$RUNNER_TEMP/mux-recovery-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/mux-recovery-negative.log"
            exit 1
          fi
          node -e "const fs=require('node:fs'); const text=fs.readFileSync(process.env.RUNNER_TEMP+'/mux-recovery-negative.log','utf8'); if(!text.includes('Mux recovery negative control detected')) { console.error(text); process.exit(1); }"
      - name: Verify mobile typography and native page-zoom settings
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:mobile-settings
      - name: Verify usable device module selection with the pinned skin
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:module-settings
      - name: Verify image handoff through the actual DSH attachment consumer
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:attachments
      - name: Detect a file transfer missing the consumer item list
        if: matrix.dsh == '0.2.0-rc.2'
        shell: bash
        run: |
          if npm run smoke:attachments -- --negative-control-items > "$RUNNER_TEMP/attachment-items-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/attachment-items-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/attachment-items-negative.log" "Attachment handoff negative control detected"
      - name: Identify an HTTP-successful client module execution failure
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        shell: bash
        run: |
          if npm run smoke:transport-recovery -- --negative-control-import > "$RUNNER_TEMP/module-evaluation-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/module-evaluation-negative.log"
            exit 1
          fi
          node -e "const fs=require('node:fs'); const text=fs.readFileSync(process.env.RUNNER_TEMP+'/module-evaluation-negative.log','utf8'); if(!text.includes('Module evaluation negative control detected')) { console.error(text); process.exit(1); }"
      - name: Verify module settings, trusted network and remote form lifetimes
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run smoke:control-state
      - name: Verify authenticated recovery from changed module dependencies
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run smoke:module-recovery
      - name: Verify early browser compatibility semantics
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:mobile-compat
      - name: Verify early startup error recovery without changing CSP or mounted DSH
        if: matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:boot-feedback
      - run: npm run smoke:browser-auth-cookies
      - name: Verify reported community auth navigation and internal cookie exchange
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run smoke:upstream-auth
      - run: npm run smoke:question-fixes
      - run: npm run smoke:dsh-boot
      - name: Verify separate desktop and mobile directory flows
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:directory-picker
      - name: Verify old-WebView API fallback and directory browsing
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:dsh-boot -- --legacy-webview
      - name: Reject old-WebView boot without the compatibility script
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        shell: bash
        run: |
          if npm run smoke:dsh-boot -- --legacy-webview --negative-control-compat > "$RUNNER_TEMP/compat-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/compat-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/compat-negative.log" "Legacy compatibility negative control detected"
      - name: Verify the stock composer through the packed Mobile profile
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run smoke:dsh-composer
      - name: Verify conversation touch scrolling on older viewport engines
        if: matrix.dsh == '0.2.0-rc.2'
        run: node scripts/smoke-conversation-scroll.mjs
      - name: Reject a mobile shell without the legacy viewport fallback
        if: matrix.dsh == '0.2.0-rc.2'
        shell: bash
        run: |
          if node scripts/smoke-conversation-scroll.mjs --negative-control-viewport > "$RUNNER_TEMP/scroll-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/scroll-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/scroll-negative.log" "Viewport negative control detected"
      - name: Verify history auto-load scroll stability
        if: matrix.dsh == '0.2.0-rc.2' || matrix.dsh == '0.2.1-alpha.3' || matrix.dsh == '0.2.1-rc.2' || matrix.dsh == '0.2.1-rc.3'
        run: npm run smoke:history-scroll
      - name: Capture credential-masked Mobile surfaces
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run capture:screenshots -- --out "$RUNNER_TEMP/mobile-capture"
      - name: Verify compressed DSH Workspace traffic
        if: matrix.dsh == '0.2.0-rc.2'
        run: npm run smoke:dsh-boot -- --compressed-websocket
      - name: Reject a packed bundle missing its companion
        if: matrix.dsh == '0.2.0-rc.2'
        shell: bash
        run: |
          if npm run smoke:dsh-boot -- --negative-control-companion > "$RUNNER_TEMP/companion-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/companion-negative.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/companion-negative.log" "Packed bundle is missing embedded component dsh-mobile-question-fixes"
      - name: Preserve module settings failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: module-settings-diagnostics-${{ matrix.dsh }}
          path: local/client-module-settings-smoke/
          if-no-files-found: ignore

  push-packed-rc3:
    name: Packed push lanes (DSH 0.2.1-rc.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install pnpm for the live DSH plugin manager
        run: npm install --global pnpm@10.10.0
      - run: npm ci
      - run: npm run build
      - name: Install DSH 0.2.1-rc.3 and pack the Mobile bundle
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/plugin-package"
          mobile_version=$(node -p "require('./package.json').version")
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --no-save --package-lock=false "@deepseek-ai/dsh@0.2.1-rc.3"
          echo "DSH_BOOT_SMOKE_BIN=$RUNNER_TEMP/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "DSH_BOOT_SMOKE_MOBILE_TARBALL=$RUNNER_TEMP/plugin-package/dsh-mobile-$mobile_version.tgz" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify passive public Web Push lifecycle contracts
        run: npm run smoke:push-contract
      - name: Verify packed Declarative Web Push UI and authenticated navigation
        run: npm run smoke:web-push
      - name: Reject a tap reference owned by another paired device
        shell: bash
        run: |
          if npm run smoke:web-push -- --negative-control-owner > "$RUNNER_TEMP/web-push-ownership-negative-rc3.log" 2>&1; then
            cat "$RUNNER_TEMP/web-push-ownership-negative-rc3.log"
            exit 1
          fi
          node scripts/negative-control.mjs "$RUNNER_TEMP/web-push-ownership-negative-rc3.log" "Push ownership negative control detected"

  push-contract-platforms:
    name: Push contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install pnpm for the live DSH plugin manager
        run: npm install --global pnpm@10.10.0
      - run: npm ci
      - run: npm run build
      - name: Install DSH 0.2.1-rc.2 and pack the Mobile bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/plugin-package"
          mobile_version=$(node -p "require('./package.json').version")
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --no-save --package-lock=false "@deepseek-ai/dsh@0.2.1-rc.2"
          echo "DSH_BOOT_SMOKE_BIN=$RUNNER_TEMP/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "DSH_BOOT_SMOKE_MOBILE_TARBALL=$RUNNER_TEMP/plugin-package/dsh-mobile-$mobile_version.tgz" >> "$GITHUB_ENV"
      - name: Verify passive public Web Push lifecycle contracts
        run: npm run smoke:push-contract
      - name: Install browser for guarded push fixture self-tests
        run: npx playwright install chromium --only-shell
      - name: Verify cross-platform guarded push transport fixtures
        run: node scripts/smoke-mobile-push.mjs --transport-self-test

  gateway:
    name: Gateway (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pnpm for Windows updater smoke test
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.10.0
      - run: npm ci
      - run: npm run verify
      - name: Verify the published Caddy component through the default installer
        if: matrix.node == '24.x'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          component_tag=caddy-component-2.11.7-tencentcloud-0.4.3-r1
          component_target=$(node -p "process.platform + '-' + process.arch")
          component_asset="caddy-2.11.7-tencentcloud-0.4.3-$component_target"
          if [[ "$component_target" == win32-x64 ]]; then component_asset="$component_asset.exe"; fi
          component_directory="$RUNNER_TEMP/caddy-default-source"
          gh release download "$component_tag" --repo saya-ch/dsh-mobile --pattern "$component_asset" --dir "$component_directory"
          DSH_CADDY_DEFAULT_TEST_EXECUTABLE="$component_directory/$component_asset" npx vitest run tests/caddy-default-source.test.ts --pool=threads --maxWorkers=1
      - name: Verify pinned Windows cpolar extraction without installer actions
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: npm run smoke:cpolar-component

  funnel-host:
    name: Funnel host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache-dependency-path: native/funnel-host/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - run: go test ./...
        working-directory: native/funnel-host
      - run: go vet ./...
        working-directory: native/funnel-host
      - run: npm run build:funnel-host
      - name: Record Funnel build metadata
        run: |
          sha256sum bin/dsh-mobile-funnel-win32-x64.exe bin/dsh-mobile-funnel-linux-x64 bin/dsh-mobile-funnel-linux-arm64
          go version -m bin/dsh-mobile-funnel-win32-x64.exe | tee dsh-mobile-funnel-build-metadata.txt
          go version -m bin/dsh-mobile-funnel-linux-x64 | tee -a dsh-mobile-funnel-build-metadata.txt
          go version -m bin/dsh-mobile-funnel-linux-arm64 | tee -a dsh-mobile-funnel-build-metadata.txt
      - run: npm run check:funnel-licenses:full
      - run: git diff --exit-code -- bin/dsh-mobile-funnel-win32-x64.exe bin/dsh-mobile-funnel-linux-x64 bin/dsh-mobile-funnel-linux-arm64 FUNNEL_THIRD_PARTY_LICENSES.txt
      - name: Preserve failed Funnel rebuild for comparison
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: funnel-rebuild-diagnostics
          path: |
            bin/dsh-mobile-funnel-win32-x64.exe
            bin/dsh-mobile-funnel-linux-x64
            bin/dsh-mobile-funnel-linux-arm64
            FUNNEL_THIRD_PARTY_LICENSES.txt
            dsh-mobile-funnel-build-metadata.txt
          if-no-files-found: error

  iroh-host:
    name: iroh host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Install first-use test dependencies on Windows
        if: runner.os == 'Windows'
        run: npm ci
      - name: Verify first use with the exact catalog-pinned Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'dsh-mobile-iroh-host-pinned.exe'
          Invoke-WebRequest -Uri 'https://unpkg.com/dsh-mobile-iroh@0.1.0-alpha.1/native/dsh-mobile-iroh-host-win32-x64.exe' -OutFile $binary
          $env:DSH_IROH_PINNED_FIRST_USE = $binary
          npx vitest run tests/iroh-pinned-first-use.test.ts
      - run: cargo fmt --all -- --check
        working-directory: native/iroh-host
      - run: cargo test --locked -p dsh-mobile-iroh-host -p dsh-mobile-iroh-core
        working-directory: native/iroh-host
      - run: cargo clippy --all-targets --locked -p dsh-mobile-iroh-host -p dsh-mobile-iroh-core -- -D warnings
        working-directory: native/iroh-host
      - run: npm run build:iroh-host
      - name: Record iroh host build metadata
        shell: bash
        run: |
          set -euo pipefail
          staged="bin/dsh-mobile-iroh-host-${{ matrix.target }}${{ matrix.target == 'win32-x64' && '.exe' || '' }}"
          test -f "$staged"
          sha256sum "$staged" | tee dsh-mobile-iroh-host-build-metadata.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iroh-host-${{ matrix.target }}
          path: |
            bin/dsh-mobile-iroh-host-${{ matrix.target }}*
            dsh-mobile-iroh-host-build-metadata.txt
          if-no-files-found: error

  cloudflared-macos:
    name: macOS cloudflared component
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/cloudflared-component.test.ts --pool=threads --maxWorkers=1
      - name: Install and inspect the pinned macOS components in temporary state
        run: npm run smoke:cloudflared-component

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Test and assemble
        # The toolchain-free lane explicitly opts out of the default native
        # transport; the android-iroh-native lane below owns the Rust build.
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug -PirohNative=false -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dsh-mobile-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-iroh-native:
    name: Android iroh native lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android API 36 and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - name: Verify the vendored Rust transport builds for both ABIs
        run: bash ./gradlew --no-daemon :app:buildIrohTransport -PirohNative=true -PirohNdk="$ANDROID_HOME/ndk/25.2.9519653"
        working-directory: apps/mobile/android
      - name: Check Android Rust dependency notice coverage
        run: node scripts/check-iroh-notices.mjs
      - name: Assemble native-enabled debug and release packages
        run: bash ./gradlew --no-daemon assembleDebug assembleRelease -PirohNative=true -PirohNdk="$ANDROID_HOME/ndk/25.2.9519653" -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Verify the packaged transport libraries
        run: |
          node ../../../scripts/build-android-transport.mjs --verify-apk app/build/outputs/apk/debug/app-debug.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          node ../../../scripts/build-android-transport.mjs --verify-apk app/build/outputs/apk/release/app-release-unsigned.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0"
        working-directory: apps/mobile/android
      - name: Rebuild compatibility after native and reject leftover libraries
        run: |
          bash ./gradlew --no-daemon assembleRelease -PirohNative=false
          node ../../../scripts/build-android-transport.mjs --verify-apk app/build/outputs/apk/release/app-release-unsigned.apk --variant compatibility --build-tools "$ANDROID_HOME/build-tools/36.0.0"
        working-directory: apps/mobile/android
